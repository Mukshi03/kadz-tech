<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin | KADZ Logistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css?v=202610241408">
</head>
<body data-page="admin">

<main>
  <div class="page-head">
    <div class="wrap dash-head">
      <div style="display:grid;gap:.6rem">
        <span class="dock"><b>Admin</b> <span id="who">…</span></span>
        <h1>Admin panel</h1>
      </div>
      <div class="actions">
        <button class="btn btn-plain" type="button" id="alerts-btn" hidden>Turn on desktop alerts</button>
        <button class="btn btn-plain" type="button" id="refresh">Refresh</button>
      </div>
    </div>
  </div>

  <section style="padding-top:2rem">
    <div class="wrap">
      <div class="stats" id="stats"></div>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="warehouses" aria-selected="true">Warehouses <span class="count" id="c-wh" hidden></span></button>
        <button class="tab" role="tab" data-tab="bookings" aria-selected="false">Quotes &amp; bookings <span class="count" id="c-bk" hidden></span></button>
        <button class="tab" role="tab" data-tab="services" aria-selected="false">Service requests <span class="count" id="c-sr" hidden></span></button>
        <button class="tab" role="tab" data-tab="quotes" aria-selected="false">Quote requests <span class="count" id="c-q" hidden></span></button>
        <button class="tab" role="tab" data-tab="users" aria-selected="false">Users</button>
      </div>

      <div data-panel="warehouses">
        <div class="inline-form" style="margin-bottom:1rem">
          <label class="ctrl" style="max-width:220px"><span class="label">Show</span>
            <select id="wh-filter" autocomplete="off">
              <option value="">All</option>
              <option value="pending">Waiting for review</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </label>
        </div>
        <div class="rows" id="wh-list"></div>
      </div>

      <div data-panel="bookings" hidden>
        <div class="inline-form" style="margin-bottom:1rem">
          <label class="ctrl" style="max-width:220px"><span class="label">Show</span>
            <select id="bk-filter" autocomplete="off">
              <option value="">All</option>
              <option value="pending">Quote requested</option>
              <option value="quoted">Quote sent</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="declined">Declined by client</option>
              <option value="rejected">Rejected</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
        </div>
        <div class="rows" id="bk-list"></div>
      </div>

      <div data-panel="services" hidden>
        <div class="inline-form" style="margin-bottom:1rem">
          <label class="ctrl" style="max-width:220px"><span class="label">Service</span>
            <select id="sr-service" autocomplete="off">
              <option value="">All</option>
              <option value="transport">Transportation</option>
              <option value="freight">Freight forwarding</option>
              <option value="customs">Customs clearance</option>
            </select>
          </label>
          <label class="ctrl" style="max-width:220px"><span class="label">Show</span>
            <select id="sr-filter" autocomplete="off">
              <option value="">All</option>
              <option value="pending">Quote requested</option>
              <option value="quoted">Quote sent</option>
              <option value="confirmed">Accepted</option>
              <option value="completed">Completed</option>
              <option value="declined">Declined by client</option>
              <option value="rejected">Rejected</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
        </div>
        <div class="rows" id="sr-list"></div>
      </div>

      <div data-panel="quotes" hidden><div class="rows" id="q-list"></div></div>

      <div data-panel="users" hidden>
        <div class="inline-form" style="margin-bottom:1rem">
          <label class="ctrl" style="max-width:320px"><span class="label">Search</span><input id="u-search" type="search" placeholder="Name, company or email"></label>
          <label class="ctrl" style="max-width:180px"><span class="label">Role</span>
            <select id="u-role" autocomplete="off"><option value="">All</option><option value="client">Client</option><option value="partner">Partner</option><option value="admin">Admin</option></select>
          </label>
        </div>
        <div class="rows" id="u-list"></div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="i18n.js?v=202610241408"></script>
<script src="config.js?v=202610241408"></script>
<script src="main.js?v=202610241408"></script>
<script src="dashboard-common.js?v=202610241408"></script>
<script src="quote-pdf.js?v=202610241408"></script>
<script src="admin.js?v=202610241408"></script>
</body>
</html>
