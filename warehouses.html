<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Find a Warehouse | KADZ Logistics</title>
  <meta name="description" content="Search warehouses by city, storage type and available pallet positions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css?v=202610271549">
</head>
<body data-page="warehouses">

<main>
  <div class="page-head">
    <div class="wrap">
      <a class="label" data-back href="index.html" style="text-decoration:none" hidden>← Back to my account</a>
      <span class="dock"><b>Search</b> Warehouses</span>
      <h1>Find a warehouse</h1>
      <p class="lead">Filter by city, storage type and the number of pallet positions you need.</p>
    </div>
  </div>

  <section style="padding-top:2rem">
    <div class="wrap listing-layout">
      <aside class="filters" aria-label="Filters">
        <label class="ctrl"><span>City</span>
          <select id="f-city" data-cities><option value="">All cities</option></select>
        </label>
        <label class="ctrl"><span>Storage type</span>
          <select id="f-type" data-types><option value="">Any type</option></select>
        </label>
        <label class="ctrl"><span>Minimum free pallets</span>
          <input id="f-pallets" type="number" min="0" inputmode="numeric" placeholder="0">
        </label>
        <label class="ctrl"><span>Sort by</span>
          <select id="f-sort" autocomplete="off">
            <option value="">Recommended</option>
            <option value="pallets">Most pallets free</option>
            <option value="area">Largest area</option>
          </select>
        </label>
      </aside>

      <div style="min-width:0">
        <div class="results-bar">
          <span class="label" id="result-count">Loading…</span>
          <div class="view-switch" role="group" aria-label="View">
            <button type="button" data-view="list" aria-pressed="true" title="List view"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="5" height="4" rx="1"/><rect x="2" y="9" width="5" height="4" rx="1"/><rect x="2" y="15" width="5" height="2.5" rx="1"/><path d="M9 5h9M9 11h9M9 16h9"/></svg><span>List</span></button>
            <button type="button" data-view="grid" aria-pressed="false" title="Grid view"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg><span>Grid</span></button>
            <button type="button" data-view="table" aria-pressed="false" title="Table view"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="1.5"/><path d="M2 8h16M2 12.5h16M8 3v14"/></svg><span>Table</span></button>
          </div>
        </div>
        <p class="est-link"><a href="estimate.html">Not sure how much space? Use the estimator →</a></p>
        <div class="listings" id="listings" aria-live="polite"></div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="i18n.js?v=202610271549"></script>
<script src="config.js?v=202610271549"></script>
<script src="main.js?v=202610271549"></script>
<script src="warehouses.js?v=202610271549"></script>
</body>
</html>
